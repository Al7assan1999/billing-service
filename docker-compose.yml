services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Billing_Dev_Pass1
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Billing_Dev_Pass1 -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 30

  api:
    build: .
    depends_on:
      sqlserver: { condition: service_healthy }
    ports:
      - "5200:8080"   # http://localhost:5200/openapi/v1.json
    environment:
      ConnectionStrings__Billing: Server=sqlserver,1433;Database=Billing;User Id=sa;Password=Billing_Dev_Pass1;TrustServerCertificate=True
